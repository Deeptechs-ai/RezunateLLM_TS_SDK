name: CI

# Checks only (lint, type check, tests, build); it never publishes.
# Every PR, whatever branch it targets, is checked on each push to it (merged with its base
# branch). Pushes to develop and main check the code after a merge.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Everything runs on the oldest supported Node.js (from .nvmrc)...
      - name: Set up Node.js (oldest supported)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The package loads correctly for import, require, TypeScript and bundlers.
      - name: Check the package exports
        run: pnpm dlx publint

      - name: Check the package types
        run: pnpm dlx @arethetypeswrong/cli --pack .

      # ...and the tests run again on the newest LTS, which follows new releases (24, 26, ...).
      - name: Set up Node.js (newest LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Test on the newest LTS
        run: |
          node --version
          pnpm test

name: Publish to npm

# Publishes when a GitHub Release is published. Uses npm trusted publishing (OIDC):
# no npm token is stored, and npm adds provenance automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing doesn't support self-hosted runners
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to check the tag is on main

      - name: Check the release is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases are published from main only; this tag is not on main."
            exit 1
          fi

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs lint, type check, tests and build before uploading.
      - name: Publish
        run: npm publish
